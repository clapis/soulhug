<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} - Soul Hug</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="keywords" content="{{ site.keywords }}">
<meta name="author" content="Soul Hug">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf7f2">
<meta property="og:title" content="{{ page.title | escape }} - Soul Hug">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url | remove: 'index.html' | remove: '.html' }}">
{%- if page.image %}
<meta property="og:image" content="{{ page.image | absolute_url | escape }}">
{%- endif %}
<link rel="icon" href="../assets/images/favicon.ico">
<link rel="canonical" href="{{ site.url }}{{ page.url | remove: 'index.html' | remove: '.html' }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600&family=Marcellus&display=swap">
<link rel="stylesheet" href="assets/site.css">
{%- if page.css %}
<link rel="stylesheet" href="assets/{{ page.css }}.css">
{%- endif %}
</head>
<body>

{% include v2/header.html %}

{{ content }}

{% include v2/footer.html %}

<script src="assets/site.js"></script>
{%- if page.js %}
<script src="assets/{{ page.js }}.js"></script>
{%- endif %}
</body>
</html>
