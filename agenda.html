function renderEvents(events) {

    const today = new Date(Date.now() - 86400000);

    const has_valid_date = event => !isNaN(new Date(event.date).getTime());
    const sort = (event_a, event_b) => new Date(event_a.date) - new Date(event_b.date);
    const format_date = event => new Intl.DateTimeFormat("en-GB", { day: "2-digit", month: "long", year: "numeric" }).format(new Date(event.date))

    const is_past = event => has_valid_date(event) && (new Date(event.date) < today);

    const html = event => {
        const article = document.createElement('article');
        article.className = `agenda-item`;
        article.innerHTML = `
            <img src="${event.image}" alt="${event.title}" class="agenda-image">
            <div class="agenda-content">
                <time class="agenda-date">${has_valid_date(event) ? format_date(event) : event.date}</time>
                <h3 class="agenda-heading">${event.title}</h1>
                <a href="${event.link}" target="_blank" class="agenda-link">Read more →</a>
            </div>
        `;
        return article;
    }

    const upcoming = document.getElementById('upcoming');

    events.filter(x => !is_past(x))
        .sort((a,b) => sort(a,b))
        .forEach(x => upcoming.appendChild(html(x)));

    const archive = document.getElementById('archive');

    events.filter(x => is_past(x))
        .sort((a,b) => sort(b, a))
        .forEach(x => archive.appendChild(html(x)));
}

// Render events
renderEvents(events);

// Toggle past events
const archive = document.getElementById("archive");
const toggle = document.getElementById("toggle-archive");

toggle.addEventListener("click", function (e) {
    e.preventDefault();
    const isHidden = archive.style.display === "none";
    archive.style.display = isHidden ? "grid" : "none";
    toggle.textContent = isHidden ? "Hide past events" : "See past events";
});
